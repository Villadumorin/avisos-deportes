name: Avisos deportes

on:
  schedule:
    # Cada 10 minutos: programa os avisos en ntfy con antelación e
    # mira se algunha sesión vai con atraso.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "Que facer"
        type: choice
        options: [programar, proba]
        default: programar

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Programar avisos
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ inputs.modo }}" = "proba" ]; then
            python avisos.py --proba
          else
            python avisos.py
          fi
